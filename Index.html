<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5a3d">
<meta name="description" content="StudyHub - your personal reading companion. Read lecture notes, highlight, practise for exams and plan your study.">
<title>StudyHub - Your Personal Reading Companion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f5a3d'/%3E%3Cpath d='M18 16h24a4 4 0 0 1 4 4v28H22a4 4 0 0 0-4 4z' fill='none' stroke='white' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#ffffff;--bg2:#f5f8f6;--card:#ffffff;--line:#e2e9e5;--ink:#12201a;--ink2:#475a50;--mute:#76867d;
  --g:#0f5a3d;--g2:#0a3f2b;--on-g:#ffffff;--gl:#e5f2eb;--gll:#f1f8f4;--accent:#c8963e;--danger:#b3261e;--ok:#177a4c;--warn:#b7791f;
  --sh:0 1px 2px rgba(10,40,28,.05),0 8px 24px -12px rgba(10,40,28,.14);--sh2:0 2px 4px rgba(10,40,28,.06),0 18px 40px -16px rgba(10,40,28,.25);
  --r:14px;--serif:'Fraunces',Georgia,'Times New Roman',serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --hl-y:rgba(250,204,21,.5);--hl-g:rgba(74,222,128,.42);--hl-b:rgba(96,165,250,.42);--hl-p:rgba(244,114,182,.38);
  --rbg:#fffefb;--rink:#1b2620;color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0b1410;--bg2:#101b16;--card:#13211a;--line:#223229;--ink:#e9f2ed;--ink2:#a8bbb0;--mute:#7b9086;
  --g:#3fbd88;--g2:#2a9a6b;--on-g:#04150d;--gl:#15302a;--gll:#12241d;--accent:#e0b05a;--danger:#f2877f;--ok:#58d19a;--warn:#e3b05c;
  --sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);--sh2:0 2px 4px rgba(0,0,0,.4),0 18px 40px -16px rgba(0,0,0,.8);
  --hl-y:rgba(250,204,21,.32);--hl-g:rgba(74,222,128,.28);--hl-b:rgba(96,165,250,.32);--hl-p:rgba(244,114,182,.3);
  --rbg:#0e1713;--rink:#dfe9e3;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;font-size:15.5px;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .25s,color .25s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--g);text-decoration:none}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2}
h1{font-size:clamp(1.6rem,3.4vw,2.15rem)} h2{font-size:1.3rem} h3{font-size:1.08rem}
:focus-visible{outline:2px solid var(--g);outline-offset:2px;border-radius:6px}
svg.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{position:sticky;top:0;height:100vh;width:252px;flex:none;border-right:1px solid var(--line);background:var(--bg);padding:22px 14px;display:none;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;font-family:var(--serif);font-weight:700;font-size:1.22rem;letter-spacing:-.01em;color:var(--ink)}
.brand small{display:block;font:500 .66rem var(--sans);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-top:1px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;display:grid;place-items:center;box-shadow:0 6px 14px -6px var(--g);flex:none}
.logo svg{width:21px;height:21px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;color:var(--ink2);font-weight:500;transition:background .15s,color .15s}
.nav a:hover,.nav button:hover{background:var(--gll);color:var(--ink)}
.nav a.on{background:var(--gl);color:var(--g);font-weight:600}
.side .grow{flex:1}
.mini-timer{display:flex;align-items:center;gap:10px;margin:8px 4px 0;padding:11px 13px;border-radius:12px;background:var(--gl);color:var(--g);font-weight:600;font-variant-numeric:tabular-nums}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:20}
.top .brand{padding:0;font-size:1.05rem;flex:1}
.top .logo{width:32px;height:32px;border-radius:9px}
#view{padding:20px 16px 96px;max-width:1120px;width:100%;margin:0 auto;animation:viewIn .35s ease both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;font-size:.68rem;font-weight:600;color:var(--mute);letter-spacing:.01em}
.bnav svg.i{width:22px;height:22px}
.bnav a.on{color:var(--g)} .bnav a.on svg{stroke-width:2.2}
.in-reader .side,.in-reader .bnav,.in-reader .top{display:none!important}
.in-reader #view{padding:0;max-width:none;animation:none}
@media(min-width:1000px){.side{display:flex}.top,.bnav{display:none}#view{padding:34px 40px 60px}}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:.66em 1.15em;border-radius:11px;font-weight:600;font-size:.92rem;background:var(--g);color:var(--on-g);border:1px solid var(--g);transition:transform .12s,box-shadow .2s,background .15s;white-space:nowrap}
.btn:hover{box-shadow:0 8px 18px -10px var(--g);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.soft{background:var(--gl);color:var(--g);border-color:transparent}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--g);color:var(--g);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.sm{padding:.42em .8em;font-size:.82rem;border-radius:9px}
.btn.lg{padding:.85em 1.5em;font-size:1rem}
.btn[disabled]{opacity:.5;pointer-events:none}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--ink2);transition:background .15s,color .15s;position:relative}
.ib:hover{background:var(--gl);color:var(--g)}
.ib.on{color:var(--g);background:var(--gl)}
.ib.heart.on{color:#d6336c;background:color-mix(in srgb,#d6336c 12%,transparent)}.ib.heart.on svg{fill:currentColor}
.ib.bm.on svg{fill:currentColor}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-bottom:10px}
.pagehead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.pagehead p{color:var(--ink2);margin-top:4px}
.eyebrow{font:600 .72rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--g)}
.muted{color:var(--ink2)}.small{font-size:.84rem}.tiny{font-size:.75rem;color:var(--mute)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.g4{grid-template-columns:repeat(4,1fr)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{padding:.42em .95em;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.84rem;font-weight:600;color:var(--ink2);white-space:nowrap;transition:all .15s}
.chip:hover{border-color:var(--g);color:var(--g)}
.chip.on{background:var(--g);color:var(--on-g);border-color:var(--g)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:.15em .6em;border-radius:99px;font-size:.72rem;font-weight:700;background:var(--gl);color:var(--g)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.bar{height:7px;border-radius:99px;background:var(--gl);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--g),color-mix(in srgb,var(--g) 60%,#7fe3b1));transition:width .6s cubic-bezier(.2,.8,.2,1)}
input:not([type]),input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:.7em .9em;border:1px solid var(--line);border-radius:11px;background:var(--bg);transition:border .15s,box-shadow .15s}
input:not([type]):focus,input:focus,select:focus,textarea:focus{outline:0;border-color:var(--g);box-shadow:0 0 0 3px color-mix(in srgb,var(--g) 22%,transparent)}
textarea{min-height:110px;resize:vertical}
label.f{display:block;font-size:.82rem;font-weight:600;color:var(--ink2);margin-bottom:5px}
.field{margin-bottom:13px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg2);border-radius:12px;width:fit-content;max-width:100%;overflow-x:auto}
.tabs button{padding:.5em 1em;border-radius:9px;font-weight:600;font-size:.86rem;color:var(--ink2);white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--g);box-shadow:var(--sh)}
.empty{text-align:center;padding:36px 16px;color:var(--ink2)}.empty svg{width:42px;height:42px;color:var(--g);opacity:.55;margin-bottom:8px}
.sep{height:1px;background:var(--line);margin:14px 0}
kbd{font:600 .75rem var(--sans);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:.05em .4em;background:var(--bg2)}

/* toasts + modal */
#toasts{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
@media(min-width:1000px){#toasts{bottom:28px}}
.toast{background:var(--ink);color:var(--bg);padding:.7em 1.1em;border-radius:12px;font-size:.9rem;font-weight:500;box-shadow:var(--sh2);animation:toastIn .3s ease both;display:flex;gap:9px;align-items:center;pointer-events:auto}
.toast.out{animation:toastOut .25s ease both}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes toastOut{to{opacity:0;transform:translateY(8px)}}
.overlay{position:fixed;inset:0;background:rgba(6,20,14,.5);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);width:min(100%,560px);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:22px;box-shadow:var(--sh2);animation:sheet .3s cubic-bezier(.2,.8,.2,1)}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
@media(min-width:700px){.overlay{align-items:center}.modal{border-radius:20px}}
.modal h2{margin-bottom:14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

/* ---------- dashboard ---------- */
.hello{display:grid;gap:16px;margin-bottom:18px}
.hero{background:linear-gradient(135deg,var(--g2),var(--g));color:#fff;border-radius:20px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--sh2)}
:root[data-theme="dark"] .hero{background:linear-gradient(135deg,#0f3b2b,#1b6a4b)}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero h1{color:#fff;margin:4px 0 6px}.hero p{color:rgba(255,255,255,.82);max-width:46ch}
.hero .btn{background:#fff;color:#0a3f2b;border-color:#fff}.hero .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.hero .bar{background:rgba(255,255,255,.22);margin:12px 0}.hero .bar i{background:#fff}
.stat{display:flex;flex-direction:column;gap:2px;padding:16px;position:relative;overflow:hidden}
.stat .ico{width:36px;height:36px;border-radius:10px;background:var(--gl);color:var(--g);display:grid;place-items:center;margin-bottom:8px}
.stat b{font:700 1.65rem var(--serif);line-height:1.1}.stat span{color:var(--ink2);font-size:.82rem}
.ring{position:relative;width:96px;height:96px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .t{stroke:var(--gl)}.ring .p{stroke:var(--g);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 1.1rem var(--serif)}
.wk{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--gl);min-height:4px;transition:height .6s}
.wk div.hi i{background:var(--g)}.wk span{font-size:.7rem;color:var(--mute);font-weight:600}.wk em{font:600 .68rem var(--sans);color:var(--ink2);font-style:normal}
.list{display:flex;flex-direction:column}
.li-row{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;border-radius:8px}
.li-row:last-child{border-bottom:0}.li-row:hover{background:var(--gll)}
.spine{width:42px;height:54px;border-radius:7px 10px 10px 7px;flex:none;display:grid;place-items:center;color:#fff;font:700 .68rem var(--sans);letter-spacing:.03em;box-shadow:inset 4px 0 0 rgba(0,0,0,.16)}
.c0{background:linear-gradient(160deg,#157a53,#0b4a33)}.c1{background:linear-gradient(160deg,#2e7d6d,#14504a)}.c2{background:linear-gradient(160deg,#6b8f3a,#3d5b1b)}
.c3{background:linear-gradient(160deg,#1f8f87,#0d5a58)}.c4{background:linear-gradient(160deg,#a67c28,#6b4c12)}.c5{background:linear-gradient(160deg,#4a7a5a,#274d38)}
.li-row .meta{flex:1;min-width:0}.li-row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.li-row .s{font-size:.8rem;color:var(--mute)}

/* ---------- library ---------- */
.searchbox{position:relative;flex:1;min-width:220px}.searchbox svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--mute)}.searchbox input{padding-left:40px}
.dcard{display:flex;flex-direction:column;gap:12px;padding:16px;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative}
.dcard:hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:color-mix(in srgb,var(--g) 40%,var(--line))}
.dcard .top2{display:flex;gap:13px}.dcard h3{font-size:1.02rem;margin-bottom:3px}.dcard .acts{position:absolute;top:8px;right:6px;display:flex}
.dcard .foot{display:flex;align-items:center;justify-content:space-between;font-size:.78rem;color:var(--mute)}
.group-h{margin:26px 0 12px;display:flex;align-items:baseline;gap:10px}.group-h h2{font-size:1.12rem}
.drop{display:block;border:2px dashed color-mix(in srgb,var(--g) 40%,var(--line));border-radius:16px;padding:26px 16px;text-align:center;background:var(--gll);transition:all .2s;cursor:pointer}
.drop:hover,.drop.over{background:var(--gl);border-color:var(--g)}
.drop svg{width:34px;height:34px;color:var(--g)}.drop svg{display:block;margin:0 auto}
.hit{padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:8px}.hit:hover{background:var(--gll)}
.hit b{font-weight:600}.hit .sn{color:var(--ink2);font-size:.9rem;margin-top:3px}.hit mark,.sn mark{background:var(--hl-y);color:inherit;border-radius:3px;padding:0 1px}
.menu{position:absolute;right:6px;top:44px;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);padding:6px;min-width:150px}
.menu button{display:flex;gap:9px;align-items:center;width:100%;padding:.55em .7em;border-radius:8px;font-size:.88rem;font-weight:500;text-align:left}.menu button:hover{background:var(--gll)}.menu .danger{color:var(--danger)}

/* ---------- reader ---------- */
.reader{position:fixed;inset:0;z-index:50;background:var(--rbg);display:flex;flex-direction:column;color:var(--rink)}
.rbar{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--rbg);flex:none}
.rbar .ttl{flex:1;min-width:0;padding:0 6px}.rbar .ttl b{display:block;font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.98rem}.rbar .ttl span{font-size:.74rem;color:var(--mute)}
.rprog{height:3px;background:var(--gl);flex:none}.rprog i{display:block;height:100%;width:0;background:var(--g);transition:width .15s}
.rwrap{flex:1;display:flex;min-height:0;position:relative}
.rscroll{flex:1;overflow-y:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.rtext{max-width:720px;margin:0 auto;padding:30px 20px 120px;font-size:var(--rfs,18px);line-height:1.8}
.rtext.serif{font-family:var(--serif);font-weight:400}.rtext.sans{font-family:var(--sans)}
.rtext .doc-h{margin-bottom:30px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.rtext .doc-h h1{font-size:1.9em;margin:6px 0}.rtext .doc-h p{font:500 .8rem var(--sans);color:var(--mute)}
.rsec{margin-bottom:38px;scroll-margin-top:12px}
.rsec>header{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.rsec>header h2{font-size:1.38em;flex:1;font-family:var(--serif)}
.rsec>header .n{font:700 .7rem var(--sans);color:var(--g);letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:2px}
.rtext p{margin:0 0 1em}.rtext ul{margin:0 0 1em 1.3em}.rtext li{margin:.25em 0}
.rtext h4{font-size:1.05em;margin:1.4em 0 .5em;font-family:var(--serif)}
.rtext pre{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow:auto;font:.82em/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0 0 1.1em;white-space:pre-wrap;color:var(--rink)}
.rtext .def{border-left:4px solid var(--g);background:var(--gll);border-radius:4px 12px 12px 4px;padding:12px 16px;margin:0 0 1.1em}
.rtext .def b{display:block;font:700 .72em var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--g);margin-bottom:3px}
.rtext .def p{margin:0}
.rtext .note{border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 9%,transparent);border-radius:12px;padding:12px 16px;margin:0 0 1.1em}.rtext .note p{margin:0}
.rtext mark.h{border-radius:3px;padding:.05em 0;color:inherit;cursor:pointer;box-decoration-break:clone;-webkit-box-decoration-break:clone}
mark.hy{background:var(--hl-y)}mark.hg{background:var(--hl-g)}mark.hb{background:var(--hl-b)}mark.hp{background:var(--hl-p)}
mark.q{background:none;color:inherit;border-bottom:2.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 22%,transparent)}
.flash{animation:flash 2s ease}@keyframes flash{0%,60%{background:color-mix(in srgb,var(--accent) 28%,transparent)}100%{background:transparent}}
.rend{text-align:center;padding:26px 0 10px}.rend .btn{margin-top:10px}
.rpanel{width:min(380px,100%);border-left:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;flex:none;color:var(--ink)}
.rpanel .tabs{margin:12px;width:auto}.rpbody{flex:1;overflow:auto;padding:4px 14px 20px}
.rpanel .xbtn{display:none}
@media(max-width:899px){

<script>
/* ===== SAMPLE LECTURE MATERIALS (part 1) =====
   Block DSL: ['p',text] paragraph · ['li',text] bullet · ['def',term,definition,simple,example] key term
              ['note',text] callout · ['code',text] code/formula · ['h',text] sub-heading
   Question DSL: ['mcq', question, [options], correctIndex, explanation] · ['tf', statement, true|false, explanation] */
const SAMPLES = [];

SAMPLES.push({
  id: 'csc201', title: 'Stacks and Queues', dept: 'Computer Science', course: 'CSC 201', courseName: 'Data Structures',
  topic: 'Linear data structures', color: 0,
  sections: [
    { title: 'What is a data structure?', blocks: [
      ['p', 'A data structure is a way of organising and storing data in a computer so that it can be used efficiently. Choosing the right data structure often decides whether a program runs in a fraction of a second or takes minutes.'],
      ['def', 'Data structure', 'A particular way of organising, storing and accessing data so that operations on it are efficient.', 'A smart way of arranging information so the computer can find, add or remove it quickly.', 'A phone contact list sorted by name lets you find a person faster than a pile of loose notes.'],
      ['p', 'Linear data structures arrange items in a sequence, one after another. Arrays, linked lists, stacks and queues are all linear. In this lecture we focus on two restricted linear structures: the stack and the queue. They are called restricted because insertion and removal are allowed only at specific positions.'],
    ]},
    { title: 'The stack (LIFO)', blocks: [
      ['p', 'A stack is a collection in which items are added and removed from the same end, called the top. The last item pushed onto the stack is the first one to be removed, so a stack follows the Last-In, First-Out principle.'],
      ['def', 'Stack', 'A linear data structure that follows the Last-In, First-Out (LIFO) principle: insertion and deletion happen only at the top.', 'A pile where you can only touch the top item.', 'A stack of plates in a canteen: you take the plate on top, and new plates are placed on top.'],
      ['def', 'LIFO', 'Last-In, First-Out: the most recently added element is the first to be removed.', 'Whatever went in last comes out first.', 'The last person to enter a lift stands near the door and is the first to leave in a very small lift.'],
      ['note', 'Remember: a stack has only one open end. Everything happens at the top.'],
    ]},
    { title: 'Stack operations and applications', blocks: [
      ['p', 'The core stack operations are listed below. Each of them takes constant time, written O(1), when the stack is implemented with an array or a linked list.'],
      ['li', 'push(x): place item x on the top of the stack.'],
      ['li', 'pop(): remove and return the top item. Popping an empty stack causes underflow.'],
      ['li', 'peek(): look at the top item without removing it.'],
      ['li', 'isEmpty(): return true when the stack has no items.'],
      ['p', 'Stacks appear everywhere in computing. The undo feature of a text editor stores your last actions on a stack. The call stack keeps track of function calls so that the program knows where to return. Compilers use stacks to check balanced brackets and to evaluate arithmetic expressions in postfix form.'],
      ['code', 'push(10); push(20); push(30);   // stack: 10 20 30  (30 is the top)\npop();                           // returns 30, stack: 10 20\npeek();                          // returns 20'],
      ['def', 'Stack overflow', 'The error that occurs when an item is pushed onto a stack that is already full.', 'You tried to put one more item on a pile that has no space left.', 'Pushing an eleventh plate onto a rack built for ten.'],
    ]},
    { title: 'The queue (FIFO)', blocks: [
      ['p', 'A queue is a collection in which items are added at one end, the rear, and removed from the other end, the front. The first item to join the queue is the first to leave, so a queue follows the First-In, First-Out principle.'],
      ['def', 'Queue', 'A linear data structure that follows the First-In, First-Out (FIFO) principle: insertion happens at the rear and deletion at the front.', 'A line of people where the person who came first is served first.', 'Students waiting in line at the bursary: the first to arrive pays first.'],
      ['li', 'enqueue(x): add item x at the rear of the queue.'],
      ['li', 'dequeue(): remove and return the item at the front.'],
      ['li', 'front(): look at the front item without removing it.'],
      ['p', 'Queues are used whenever resources are shared in order of arrival: print jobs waiting for a printer, processes waiting for the CPU, and customers waiting for service. Breadth-first search in graphs also relies on a queue.'],
    ]},
    { title: 'Types of queues', blocks: [

SAMPLES.push({
  id: 'csc305', title: 'Process Scheduling and Deadlocks', dept: 'Computer Science', course: 'CSC 305', courseName: 'Operating Systems',
  topic: 'Process management', color: 0,
  sections: [
    { title: 'Processes and their states', blocks: [
      ['p', 'A program is a passive set of instructions stored on disk. When the operating system loads it into memory and starts executing it, it becomes a process. A process needs resources such as CPU time, memory and files to do its work.'],
      ['def', 'Process', 'A program in execution, including its code, data, stack and the current values of the CPU registers.', 'A program that is currently running.', 'A song file on your phone is a program; the moment you press play it becomes a running process.'],
      ['p', 'During its life a process moves between several states. The operating system keeps track of these states so that it can decide which process should use the CPU next.'],
      ['li', 'New: the process is being created.'],
      ['li', 'Ready: the process is waiting to be given the CPU.'],
      ['li', 'Running: its instructions are being executed on the CPU.'],
      ['li', 'Waiting (blocked): the process is waiting for an event such as input or output to finish.'],
      ['li', 'Terminated: the process has finished execution.'],
    ]},
    { title: 'Process control block and context switching', blocks: [
      ['p', 'The operating system stores everything it needs to know about a process in a data structure called the Process Control Block (PCB). It contains the process identifier, the process state, the program counter, CPU register values, memory limits and a list of open files.'],
      ['def', 'Process Control Block', 'A data structure maintained by the operating system that holds all the information about a process.', 'The ID card and file folder the operating system keeps for every process.', 'Like a student record file containing matric number, level and results, so the school can pick up exactly where it left off.'],
      ['p', 'When the CPU switches from one process to another, the operating system saves the state of the old process in its PCB and loads the saved state of the new one. This is called a context switch. It is pure overhead because no useful work is done for any process while it happens.'],
      ['def', 'Context switch', 'The act of saving the state of the running process and loading the state of another process so that the CPU can switch between them.', 'Pausing one job, saving your place, and starting another.', 'You bookmark page 40 of a textbook, open another book, and later return to exactly page 40.'],
    ]},
    { title: 'Scheduling criteria', blocks: [
      ['p', 'The CPU scheduler selects one of the processes in the ready queue and gives it the CPU. Different algorithms are compared using several criteria.'],
      ['li', 'CPU utilisation: keep the CPU as busy as possible.'],
      ['li', 'Throughput: the number of processes completed per unit of time.'],
      ['li', 'Turnaround time: total time from submission to completion.'],
      ['li', 'Waiting time: the total time a process spends waiting in the ready queue.'],
      ['li', 'Response time: the time from submission until the first response is produced.'],
      ['note', 'A good scheduler maximises CPU utilisation and throughput while minimising turnaround, waiting and response time.'],
    ]},
    { title: 'Scheduling algorithms', blocks: [
      ['p', 'First-Come, First-Served (FCFS) runs processes in the order they arrive. It is simple, but a long process at the front makes everyone behind it wait. This is called the convoy effect.'],
      ['p', 'Shortest Job First (SJF) always runs the process with the shortest CPU burst next. It gives the minimum average waiting time, but long processes may starve and the burst length must be predicted.'],
      ['p', 'Priority scheduling runs the process with the highest priority. Low-priority processes can starve, which is usually solved by aging: gradually increasing the priority of processes that wait for a long time.'],
      ['p', 'Consider three processes that arrive together with CPU bursts of 24, 3 and 3 milliseconds. Under FCFS in the order P1, P2, P3 the waiting times are 0, 24 and 27, giving an average of 17 ms. Under SJF the order becomes P2, P3, P1 and the waiting times are 0, 3 and 6, an average of only 3 ms.'],
      ['def', 'Starvation', 'A situation in which a process waits indefinitely because other processes are always chosen ahead of it.', 'A process that never gets its turn.', 'A student with a very long question who is skipped again and again because shorter questions keep arriving.'],
    ]},
    { title: 'Round Robin scheduling', blocks: [
      ['p', 'Round Robin (RR) was designed for time-sharing systems. Each process receives a small unit of CPU time called a time quantum, usually 10 to 100 milliseconds. When the quantum expires the process is moved to the back of the ready queue and the next process runs.'],
      ['def', 'Time quantum', 'The small fixed amount of CPU time that a process is allowed to run in Round Robin scheduling before it is preempted.', 'Each process gets a short turn, then goes to the back of the line.', 'In a group discussion where everyone is given two minutes to speak before the next person starts.'],
      ['p', 'The size of the quantum is critical. If it is too large, Round Robin behaves like FCFS. If it is too small, the system wastes too much time on context switches. A common rule of thumb is that about 80 percent of CPU bursts should be shorter than the quantum.'],
      ['p', 'Using the same example with a quantum of 4 ms, the waiting times are 6 ms for P1, 4 ms for P2 and 7 ms for P3, an average of about 5.67 ms. Round Robin gives good response time, although its average waiting time is higher than SJF.'],
    ]},
    { title: 'Deadlock', blocks: [
      ['p', 'A deadlock is a situation in which a set of processes are blocked forever because each process holds a resource and waits for a resource held by another process in the set. None of them can ever continue.'],
      ['def', 'Deadlock', 'A state in which each process in a set is waiting for a resource that only another process in the set can release.', 'Everyone is waiting for someone else, so nobody moves.', 'Two cars meet on a one-lane bridge from opposite sides; neither can go forward and neither will reverse.'],
      ['p', 'A deadlock can occur only if all four of the following conditions hold at the same time. Breaking any one of them prevents deadlock.'],
      ['li', 'Mutual exclusion: at least one resource can be used by only one process at a time.'],
      ['li', 'Hold and wait: a process holds some resources while waiting for others.'],
      ['li', 'No preemption: a resource can only be released voluntarily by the process holding it.'],
      ['li', 'Circular wait: there is a cycle of processes, each waiting for a resource held by the next one.'],
    ]},
  ],
  questions: [
    ['mcq', 'Which process state means the process is waiting for the CPU?', ['New', 'Ready', 'Waiting', 'Terminated'], 1, 'A ready process has everything it needs except the CPU. A waiting (blocked) process is waiting for an event such as I/O.'],
    ['mcq', 'What does the operating system store in the Process Control Block (PCB)?', ['Only the program code', 'Information about a process such as its state and registers', 'The list of all users', 'Only the process priority'], 1, 'The PCB holds the process ID, state, program counter, registers, memory limits and open files.'],
    ['mcq', 'Which scheduling algorithm gives the minimum average waiting time?', ['First-Come, First-Served', 'Round Robin', 'Shortest Job First', 'Priority scheduling'], 2, 'Shortest Job First is provably optimal for minimising average waiting time.'],
    ['mcq', 'What is the convoy effect?', ['Many short processes waiting behind one long process', 'Processes sharing one memory block', 'A process creating child processes', 'Priority being increased over time'], 0, 'In FCFS a long process at the front forces all the short processes behind it to wait.'],
    ['mcq', 'Which technique prevents starvation in priority scheduling?', ['Aging', 'Swapping', 'Paging', 'Spooling'], 0, 'Aging gradually increases the priority of processes that have waited a long time.'],
    ['mcq', 'Which of the following is NOT one of the four necessary conditions for deadlock?', ['Mutual exclusion', 'Hold and wait', 'Round robin', 'Circular wait'], 2, 'The four conditions are mutual exclusion, hold and wait, no preemption and circular wait. Round robin is a scheduling algorithm.'],
    ['tf', 'A context switch performs useful work for the user processes.', false, 'A context switch is overhead: while it happens no process makes progress.'],
    ['tf', 'If the time quantum in Round Robin is very large, it behaves like FCFS.', true, 'With a huge quantum each process finishes within its first turn, so the order is simply first-come, first-served.'],
    ['tf', 'A deadlock can occur even if only three of the four necessary conditions hold.', false, 'All four conditions must hold at the same time for a deadlock to occur.'],
  ],
});

SAMPLES.push({
  id: 'mth102', title: 'Introduction to Differentiation', dept: 'Mathematics', course: 'MTH 102', courseName: 'Calculus I',
  topic: 'Differential calculus', color: 1,
  sections: [
    { title: 'The idea of a derivative', blocks: [
      ['p', 'Differentiation is the mathematics of change. The derivative of a function tells you how fast the output changes when the input changes. Geometrically, it is the gradient (slope) of the tangent line to the curve at a point.'],
      ['def', 'Derivative', 'The instantaneous rate of change of a function with respect to its variable; the gradient of the tangent to the curve at a point.', 'How steeply a graph is rising or falling at one exact point.', 'A car\'s speedometer shows the derivative of distance with respect to time.'],
      ['p', 'If y = f(x), the derivative is written f\'(x), dy/dx or df/dx. Velocity is the derivative of displacement, and acceleration is the derivative of velocity.'],
    ]},
    { title: 'Definition from first principles', blocks: [
      ['p', 'The derivative is defined as a limit. We take two points on the curve that are a small distance h apart and let h approach zero. The gradient of the line joining them becomes the gradient of the tangent.'],
      ['code', 'f\'(x) = lim (h → 0)  [ f(x + h) − f(x) ] / h'],
      ['p', 'For example, if f(x) = x², then [f(x+h) − f(x)]/h = (2xh + h²)/h = 2x + h. As h tends to zero this becomes 2x. So the derivative of x² is 2x.'],
      ['def', 'Limit', 'The value that a function approaches as its input gets closer and closer to a given point.', 'Where a calculation is heading as you get closer and closer to a point.', 'As you walk toward a door, the limit of your distance from the door is zero, even if you never count the last step.'],
    ]},
    { title: 'Basic rules of differentiation', blocks: [
      ['p', 'Calculating every derivative from first principles would be slow, so we use rules. These are the three most basic ones.'],
      ['li', 'Constant rule: the derivative of a constant is zero. If f(x) = 7 then f\'(x) = 0.'],
      ['li', 'Power rule: if f(x) = xⁿ then f\'(x) = n·xⁿ⁻¹. For example, x³ becomes 3x².'],
      ['li', 'Sum and constant-multiple rule: differentiate term by term. If f(x) = 3x² + 5x then f\'(x) = 6x + 5.'],
      ['note', 'Power rule in words: bring the power down as a multiplier, then reduce the power by one.'],
    ]},
    { title: 'Product and quotient rules', blocks: [
      ['p', 'When two functions are multiplied or divided you cannot simply differentiate each part separately. Let u and v be functions of x.'],
      ['def', 'Product rule', 'If y = u·v then dy/dx = u\'v + uv\'.', 'Differentiate the first and keep the second, then keep the first and differentiate the second.', 'For y = x²(x + 1): u = x², v = x + 1, so dy/dx = 2x(x + 1) + x²(1) = 3x² + 2x.'],
      ['def', 'Quotient rule', 'If y = u/v then dy/dx = (u\'v − uv\')/v².', 'Bottom times derivative of top, minus top times derivative of bottom, all over bottom squared.', 'For y = x/(x + 1): dy/dx = [(1)(x + 1) − x(1)]/(x + 1)² = 1/(x + 1)².'],
    ]},
    { title: 'The chain rule', blocks: [
      ['p', 'The chain rule is used for a function of a function, also called a composite function, such as (2x + 1)⁵. We differentiate the outer function, keep the inside unchanged, and multiply by the derivative of the inside.'],
      ['code', 'If y = f(g(x)) then dy/dx = f\'(g(x)) · g\'(x)'],
      ['def', 'Chain rule', 'The rule for differentiating a composite function: differentiate the outer function and multiply by the derivative of the inner function.', 'Differentiate from the outside in and multiply the results.', 'For y = (2x + 1)⁵: dy/dx = 5(2x + 1)⁴ × 2 = 10(2x + 1)⁴.'],
    ]},
    { title: 'Applications: stationary points', blocks: [
      ['p', 'A stationary point of a curve is a point where the gradient is zero, that is f\'(x) = 0. Stationary points include maxima, minima and points of inflexion. To find them, differentiate, set the derivative equal to zero and solve for x.'],
      ['p', 'Take y = x² − 4x + 3. Then dy/dx = 2x − 4. Setting 2x − 4 = 0 gives x = 2. When x = 2, y = 4 − 8 + 3 = −1, so the stationary point is (2, −1).'],
      ['def', 'Stationary point', 'A point on a curve where the derivative is zero, so the tangent is horizontal.', 'A flat spot on the graph where the curve stops rising or falling for a moment.', 'The very top of a thrown ball\'s path, where it stops going up and has not started coming down.'],
      ['p', 'To decide whether it is a maximum or a minimum, use the second derivative. If f\'\'(x) is positive the point is a minimum, and if it is negative the point is a maximum. Here f\'\'(x) = 2, which is positive, so (2, −1) is a minimum.'],
    ]},
  ],
  questions: [
    ['mcq', 'What is the derivative of x³?', ['x²', '3x²', '3x³', 'x⁴/4'], 1, 'By the power rule, bring the power down and reduce it by one: 3x².'],
    ['mcq', 'Differentiate f(x) = 3x² + 5x.', ['6x + 5', '3x + 5', '6x² + 5', '6x'], 0, 'Differentiate each term: 3x² gives 6x and 5x gives 5.'],
    ['mcq', 'The derivative of any constant, such as 7, is…', ['7', '1', '0', 'Undefined'], 2, 'A constant does not change, so its rate of change is zero.'],
    ['mcq', 'Which rule is used to differentiate y = (2x + 1)⁵?', ['Product rule', 'Quotient rule', 'Chain rule', 'Constant rule'], 2, 'It is a function of a function (a composite), so the chain rule applies: 10(2x + 1)⁴.'],
    ['mcq', 'What is the stationary point of y = x² − 4x + 3?', ['(1, 0)', '(2, −1)', '(−2, 15)', '(4, 3)'], 1, 'dy/dx = 2x − 4 = 0 gives x = 2 and y = 4 − 8 + 3 = −1.'],
    ['mcq', 'Which formula is the product rule for y = uv?', ['u\'v − uv\'', 'u\'v + uv\'', 'u\'v\'', '(u\'v − uv\')/v²'], 1, 'The product rule is dy/dx = u\'v + uv\'.'],
    ['tf', 'The derivative gives the gradient of the tangent to a curve at a point.', true, 'That is the geometric meaning of the derivative.'],
    ['tf', 'If f\'\'(x) is positive at a stationary point, the point is a maximum.', false, 'A positive second derivative means the curve is concave up, so the stationary point is a minimum.'],
    ['tf', 'The derivative of a sum is the sum of the derivatives.', true, 'Differentiation can be done term by term for sums and differences.'],

    if (t.split(/\s+/).length <= 4) return AI.term(t, docId);
    const defs = allDefs(); const low = t.toLowerCase();
    const seen = new Set(); const hits = defs.filter(d => low.includes(d.term.toLowerCase()) && !seen.has(d.term.toLowerCase()) && seen.add(d.term.toLowerCase())).slice(0, 4);
    const sents = sentencesOf(t);
    const bullets = sents.slice(0, 5).map(s => { let x = s.replace(/\s*\([^)]*\)/g, ''); const cut = x.split(/[;:]| which | so that /)[0]; return clip(cut.length > 50 ? cut : x, 170); });
    let html = `<h4>In plain words</h4><ul>${bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>`;
    if (hits.length) {
      html += `<h4>Difficult terms in this passage</h4><ul>${hits.map(d => `<li><b>${esc(d.term)}</b>: ${esc(d.simple)}</li>`).join('')}</ul>`;
      const ex = hits.find(d => d.example); if (ex) html += `<h4>Think of it like this</h4><p>${esc(ex.example)}</p>`;
    } else {
      const { words } = keywords([{ blocks: [{ t: 'p', text: t }] }], 6); if (words.length) html += `<h4>Words to focus on</h4><p>${words.map(esc).join(' · ')}</p>`;
    }
    html += `<p class="tiny">Demo explanation built from your own documents. A real AI model would rephrase this in more depth.</p>`;
    return html;
  },
  ask(q, ctx) {
    const qs = q.trim(); if (!qs) return '<p>Type a question or a term.</p>';
    const defs = allDefs(); const low = qs.toLowerCase().replace(/^(what is|what are|define|explain|meaning of|what does)\s+/, '').replace(/[?.!]+$/, '').replace(/^(a|an|the)\s+/, '').trim();
    if (defs.some(d => d.term.toLowerCase() === low || (low.length > 3 && d.term.toLowerCase().includes(low)))) return AI.term(low, ctx && ctx.docId);
    const qw = new Set(wordsOf(qs).filter(w => !STOP.has(w))); if (!qw.size) return AI.term(low, ctx && ctx.docId);
    const pool = []; const ids = ctx && ctx.docId ? [ctx.docId] : Object.keys(CONTENT);
    ids.forEach(id => sectionsOf(id).forEach((s, si) => secSents(s).forEach(x => { const ws = new Set(wordsOf(x)); let sc = 0; qw.forEach(w => { if (ws.has(w)) sc++; }); if (sc) pool.push({ x, id, si, sc: sc / Math.sqrt(qw.size) + (x.length > 60 ? .2 : 0) }); })));
    pool.sort((a, b) => b.sc - a.sc); const top = pool.slice(0, 3);
    if (!top.length) return `<p>I could not find an answer in ${ctx && ctx.docId ? 'this document' : 'your materials'}.</p><p class="tiny">This demo searches your documents for sentences related to your question. Answering general questions needs an AI API connection.</p>`;
    return `<h4>What your materials say</h4><ul>${top.map(t => `<li>${esc(clip(t.x, 260))} <span class="tiny">(${esc(docById(t.id).title)} · ${esc(sectionsOf(t.id)[t.si].title)})</span></li>`).join('')}</ul>${srcBtn(top[0].id, top[0].si)}<p class="tiny">Found by keyword matching, not by a language model.</p>`;
  },
};

/* ---------- practice-question generator ---------- */
let lastGen = [];
function genQuestions(ctx, n = 8) {
  const secs = secsOf(ctx); const docId = ctx.docId || null;
  const { tf, words, terms } = keywords(secs); const kw = [...new Set([...terms.filter(t => !/\s/.test(t) || t.length < 20), ...words])];
  const defs = []; secs.forEach(s => s.blocks.forEach(b => { if (b.t === 'def') defs.push(b); }));
  const sents = []; secs.forEach(s => s.blocks.forEach(b => { if (['p', 'note', 'li'].includes(b.t)) sentencesOf(b.text).forEach(x => { if (x.length >= 55 && x.length <= 230) sents.push(x); }); }));
  const mk = o => ({ ...o, id: 'g' + hash(o.type + o.q + (o.opts || []).join('|')), doc: docId, gen: true });
  const pools = { def: [], cloze: [], tf: [] };
  const termPool = [...new Set([...defs.map(d => d.term), ...allDefs().map(d => d.term)])];
  defs.forEach(d => {
    const others = shuffle(termPool.filter(t => t.toLowerCase() !== d.term.toLowerCase())).slice(0, 3); if (others.length < 3) return;
    const opts = shuffle([d.term, ...others]);
    pools.def.push(mk({ type: 'mcq', q: `Which term is described as: "${clip(d.text, 200)}"`, opts, a: opts.indexOf(d.term), exp: `${d.term}: ${d.text}` }));
  });
  shuffle(sents).forEach(s => {
    const present = kw.filter(k => new RegExp('\\b' + reEsc(k) + '\\b', 'i').test(s)); if (!present.length) return;
    const k = present.sort((a, b) => (tf[b] || 1) * b.length - (tf[a] || 1) * a.length)[0];
    const re = new RegExp('\\b' + reEsc(k) + '\\b', 'i'); const exact = s.match(re)[0];
    const pick = shuffle(kw.filter(w => w.toLowerCase() !== k.toLowerCase() && !new RegExp('\\b' + reEsc(w) + '\\b', 'i').test(s)));
    if (pick.length >= 3 && pools.cloze.length < 12) {
      const opts = shuffle([exact.toLowerCase() === exact ? k : exact, ...pick.slice(0, 3).map(x => exact[0] === exact[0].toUpperCase() ? x.charAt(0).toUpperCase() + x.slice(1) : x)]);
      pools.cloze.push(mk({ type: 'mcq', q: 'Fill in the blank: ' + s.replace(re, '_____'), opts, a: opts.indexOf(exact.toLowerCase() === exact ? k : exact), exp: s }));
    }
    if (pick.length && pools.tf.length < 12) {
      const truth = pools.tf.length % 2 === 0; const stmt = truth ? s : s.replace(re, pick[0]);
      if (stmt !== s || truth) pools.tf.push(mk({ type: 'tf', q: stmt, a: truth, exp: truth ? 'This is stated in your notes.' : `The original sentence is: ${s}` }));
    }
  });
  const order = []; const names = ['def', 'cloze', 'tf'];
  for (let i = 0; order.length < n && i < 40; i++) { const p = pools[names[i % 3]]; if (p.length) { const q = p.shift(); if (!order.some(o => o.q === q.q)) order.push(q); } if (!pools.def.length && !pools.cloze.length && !pools.tf.length) break; }
  return order;
}

  const foot = (pg, n) => { pg.line(28, H - 26, W - 28, H - 26, '#dddddd'); pg.text(28, H - 20, `Generated by StudyHub on ${gen}`, 7.5, { color: '#777777' }); pg.text(W - 60, H - 20, `Page ${n}`, 7.5, { color: '#777777' }); };
  let p = doc.page(); p.rect(0, 0, W, 54, { fill: '#0f5a3d' }); p.text(28, 14, 'Weekly Timetable', 18, { bold: true, color: '#ffffff' });
  const who = S.name ? S.name + '  |  ' : ''; p.text(28, 36, `${who}${plural(TT.courses.length, 'course')}  |  ${sum.units} units  |  ${plural(sum.lectures, 'class')} per week  |  ${fmtDur(sum.total)} in class`, 9, { color: '#d7eadf' });
  const gx = 62, gy = 96, gw = W - 28 - gx, gh = H - 40 - gy, cw = gw / days.length, hp = gh / ((to - from) / 60);
  days.forEach((d, i) => { p.rect(gx + i * cw, 66, cw, 24, { fill: '#e5f2eb', stroke: '#ffffff' }); p.text(gx + i * cw + 6, 73, DAYN[d], 9.5, { bold: true, color: '#0f5a3d' }); });
  for (let h = from; h <= to; h += 60) { const y = gy + (h - from) / 60 * hp; p.line(gx, y, W - 28, y, '#e2e9e5'); if (h < to) p.text(28, y + 2, tstr(h), 7.5, { color: '#666666' }); }
  days.forEach((d, i) => { p.line(gx + i * cw, gy, gx + i * cw, gy + gh, '#e2e9e5'); });
  p.line(W - 28, gy, W - 28, gy + gh, '#e2e9e5');
  const drawItem = (x, y, w, h, o) => { p.rect(x, y, w, h, { fill: o.fill, stroke: o.stroke, dash: o.dash, lw: .8 }); if (o.bar) p.rect(x, y, 3, h, { fill: o.bar }); const lines = [[o.l1, 8.5, true], [o.l2, 7, false], [o.l3, 7, false], [o.l4, 7, false]].filter(l => l[0]); let ty = y + 3; lines.forEach(([t, sz, b]) => { if (ty + sz + 1 > y + h) return; p.text(x + 7, ty, pdfFit(t, sz, w - 11, b), sz, { bold: b, color: b ? '#111111' : '#444444' }); ty += sz + 2.4; }); };
  days.forEach((d, i) => { TT.slots.filter(s => s.day === d).forEach(s => { const c = cOf(s.courseId); const y = gy + (s.start - from) / 60 * hp, h = (s.end - s.start) / 60 * hp; drawItem(gx + i * cw + 1.5, y + 1, cw - 3, h - 2, { fill: mixW(c.color, .16), stroke: c.color, bar: c.color, l1: c.code + (s.locked ? ' (fixed)' : ''), l2: c.title, l3: `${tstr(s.start)} - ${tstr(s.end)}  ${s.type}`, l4: sVenue(s) }); }); });
  if (S.tt.showStudy) days.forEach((d, i) => { studyFor(addDays(ws, d)).filter(x => x.start >= 0 && x.kind !== 'goal').forEach(x => { const y = gy + (x.start - from) / 60 * hp, h = Math.max(14, (x.end - x.start) / 60 * hp); const overl = TT.slots.some(s => s.day === d && x.start < s.end && s.start < x.end); const w = overl ? cw / 2 - 2 : cw - 3; drawItem(gx + i * cw + (overl ? cw / 2 : 1.5), y + 1, w, h - 2, { stroke: '#888888', dash: true, l1: 'Personal: ' + ({ reading: 'Reading', revision: 'Revision', assignment: 'Due', break: 'Break' }[x.kind]), l2: x.title, l3: `${tstr(x.start)} - ${tstr(x.end)}` }); }); });
  foot(p, 1);
  // page 2: course list
  p = doc.page(); let pn = 2; p.text(28, 28, 'Course list', 16, { bold: true, color: '#0f5a3d' }); const cols = [['Code', 28, 70], ['Title', 98, 250], ['Units', 348, 40], ['Lecturer', 388, 150], ['Venue', 538, 110], ['Per week', 648, 60], ['Hours', 708, 50]];
  const head = y => { p.rect(28, y, W - 56, 18, { fill: '#e5f2eb' }); cols.forEach(([n, x]) => p.text(x + 4, y + 5, n, 8.5, { bold: true, color: '#0f5a3d' })); }; let y = 54; head(y); y += 18;
  sum.byCourse.forEach(({ c, sessions, minutes }) => { if (y > H - 56) { foot(p, pn++); p = doc.page(); y = 36; head(y); y += 18; } p.rect(28, y + 4, 8, 8, { fill: c.color }); const v = [c.code, c.title, String(c.units), c.lecturer || '-', c.venue || '-', `${sessions}/${c.perWeek}`, (minutes / 60).toFixed(1)]; cols.forEach(([, x, w], i) => p.text(x + (i === 0 ? 14 : 4), y + 5, pdfFit(v[i], 8.5, w - (i === 0 ? 16 : 8), i === 0), 8.5, { bold: i === 0 })); p.line(28, y + 18, W - 28, y + 18, '#eeeeee'); y += 18; });
  y += 10; p.text(28, y, `Total: ${plural(TT.courses.length, 'course')}, ${sum.units} units`, 9, { bold: true });
  if (y > H - 200) { foot(p, pn++); p = doc.page(); y = 20; } y += 28;
  p.text(28, y, 'Weekly summary', 14, { bold: true, color: '#0f5a3d' }); y += 24;
  [['Classes per week', String(sum.lectures)], ['Total class time', fmtDur(sum.total)], ['Days with classes', String(sum.daysUsed)], ['Busiest day', sum.busiest || '-']].forEach(([a, b]) => { p.text(28, y, a, 9, { color: '#555555' }); p.text(170, y, b, 9, { bold: true }); y += 14; });
  y += 6; sum.perDay.filter(d => d.count).forEach(d => { if (y > H - 44) return; p.text(28, y, d.name, 9, { bold: true }); p.text(110, y, `${plural(d.count, 'class')}, ${fmtDur(d.minutes)}, ${fmtT(d.first)} to ${fmtT(d.last)}`, 9, { color: '#333333' }); y += 13; });
  foot(p, pn); return doc.build();
}

/* ===================== TIMETABLE: views, editors, reminders ===================== */

/* ---------- grid / day / month renderers ---------- */
function studyCard(x, dk, d, from, HP, interactive = true) {
  if (x.start < 0 || x.kind === 'goal') return ''; const top = (x.start - from) / 60 * HP, ht = Math.max(20, (x.end - x.start) / 60 * HP - 2);
  const half = TT.slots.some(s => s.day === d && x.start < s.end && s.start < x.end); const col = x.courseId ? colorOf(x.courseId) : '#64748b'; const done = isDone(x, dk);
  return `<div class="ttc st ${half ? 'half' : ''} ${done ? 'done' : ''}" ${interactive ? `data-act="study-edit" data-id="${x.id}" data-dk="${dk}" tabindex="0"` : ''} style="top:${top}px;height:${ht}px;--c:${col}"><b>${ic(x.kind === 'break' ? 'pause' : x.kind === 'assignment' ? 'file' : 'book')} ${esc(x.title)}</b>${ht >= 36 ? `<em>Personal · ${KIND[x.kind]}</em>` : ''}</div>`;
}
function weekGrid(ws, print) {
  const days = shownDays(); const [from, to] = gridBounds(); const HP = print ? 40 : 58; const H = (to - from) / 60 * HP; const today = dkey(); const nowM = nowMin(ttNow());
  const conf = new Set(); allConflicts().forEach(([a, b]) => { conf.add(a.id); conf.add(b.id); });
  const allday = S.tt.showStudy ? days.map(d => studyFor(addDays(ws, d)).filter(x => x.start < 0 || x.kind === 'goal')) : days.map(() => []); const hasAD = allday.some(a => a.length);
  let h = `<div class="ttwrap"><div class="ttgrid" style="--nd:${days.length}"><div class="tth"></div>`;
  days.forEach(d => { const dk = addDays(ws, d); h += `<div class="tth ${dk === today ? 'today' : ''}"><span>${DAY3[d]}</span><b>${fromKey(dk).getDate()}</b></div>`; });
  if (hasAD) { h += `<div class="ttad"></div>`; days.forEach((d, i) => { h += `<div class="ttad">${allday[i].map(x => `<span class="chip2 ${isDone(x, addDays(ws, d)) ? 'done' : ''}" ${print ? '' : `data-act="study-edit" data-id="${x.id}" data-dk="${addDays(ws, d)}"`}>${ic(x.kind === 'goal' ? 'target' : 'file')} ${esc(x.title)}</span>`).join('')}</div>`; }); }
  h += `<div class="tthrs" style="height:${H}px">${Array.from({ length: (to - from) / 60 }, (_, i) => `<span style="top:${i * HP}px">${fmtT(from + i * 60)}</span>`).join('')}</div>`;
  days.forEach(d => {
    const dk = addDays(ws, d); let c = `<div class="ttcol ${dk === today ? 'today' : ''}" ${print ? '' : 'data-act="tt-cell"'} data-day="${d}" data-from="${from}" data-hp="${HP}" style="height:${H}px;background-size:100% ${HP}px">`;
    TT.slots.filter(s => s.day === d).forEach(s => { const cs = cOf(s.courseId); if (!cs) return; const top = (s.start - from) / 60 * HP, ht = (s.end - s.start) / 60 * HP - 2; const v = sVenue(s);
      c += `<div class="ttc ${conf.has(s.id) ? 'bad' : ''} ${s.locked ? 'lk' : ''}" ${print ? '' : `data-act="slot-edit" data-slot="${s.id}" tabindex="0"`} style="top:${top}px;height:${ht}px;--c:${cs.color}" title="${esc(cs.code + ' ' + cs.title)}"><b>${esc(cs.code)}</b>${ht >= 38 ? `<span>${esc(cs.title)}</span>` : ''}<em>${fmtRange(s.start, s.end)}${v && ht >= 66 ? ' · ' + esc(v) : ''}</em>${ht >= 54 ? `<u>${s.type}</u>` : ''}${s.locked ? `<i class="lkic">${ic('lock')}</i>` : ''}</div>`; });
    if (S.tt.showStudy) studyFor(dk).forEach(x => { c += studyCard(x, dk, d, from, HP, !print); });
    if (dk === today && nowM >= from && nowM <= to && !print) c += `<i class="ttnow" style="top:${(nowM - from) / 60 * HP}px"></i>`;
    h += c + '</div>';
  });
  return h + '</div></div>';
}

function monthHTML(dk) {

function openPanel(tab) { rd.panel = true; rd.tab = tab || rd.tab; if (!$('#rpanel')) { const a = document.createElement('aside'); a.className = 'rpanel'; a.id = 'rpanel'; a.setAttribute('aria-label', 'Reader tools'); $('#rwrap').appendChild(a); } renderPanel(); }
function closePanel() { rd.panel = false; const p = $('#rpanel'); if (p) p.remove(); }
function renderPanel() {
  const pn = $('#rpanel'); if (!pn) return; const d = docById(rd.id); const secs = sectionsOf(rd.id); const T = [['toc', 'Contents'], ['bm', 'Bookmarks'], ['hl', 'Highlights'], ['ai', 'Ask AI']]; let body = '';
  const top = pn.querySelector('.rpbody'); const keep = top ? top.scrollTop : 0;
  if (rd.tab === 'toc') body = `<div class="toc">${secs.map((s, i) => `<a data-act="r-sec" data-s="${i}" class="${i === curSec() ? 'on' : ''}"><span>${i + 1}</span>${esc(s.title)}</a>`).join('') || '<div class="empty small">No sections.</div>'}</div>`;
  else if (rd.tab === 'bm') { const b = S.bookmarks.filter(x => x.doc === rd.id).sort((a, c) => a.t - c.t); body = b.length ? b.map(x => `<div class="item" data-act="open-bm" data-id="${x.id}"><q style="border-color:var(--g)">${esc(x.label)}</q><div class="m"><span>${x.page ? 'Page ' + x.page : 'Section ' + (x.sec + 1)}</span><button class="ib" data-act="bm-del" data-id="${x.id}" style="width:26px;height:26px" aria-label="Remove">${ic('trash')}</button></div></div>`).join('') : `<div class="empty small">${ic('bookmark')}<div>No bookmarks here yet.</div><div>Tap the bookmark icon at the top.</div></div>`; }
  else if (rd.tab === 'hl') { const h = (S.hl[rd.id] || []).slice().sort((a, b) => a.s - b.s || a.b - b.b || a.a - b.a); body = (rd.mode === 'pdf' ? `<div class="demo" style="margin-bottom:10px">${ic('info')}<span>Highlighting works in <button style="color:var(--g);font-weight:700" data-act="r-mode" data-k="text">Reading view</button>.</span></div>` : '') + (h.length ? h.map(x => `<div class="item" data-act="open-hl" data-doc="${rd.id}" data-id="${x.id}"><q style="border-color:var(--hl-${x.c})">${esc(clip(x.tx, 160))}</q><div class="m"><span>Section ${x.s + 1}</span><button class="ib" data-act="hl-del" data-doc="${rd.id}" data-id="${x.id}" style="width:26px;height:26px" aria-label="Remove">${ic('trash')}</button></div></div>`).join('') : `<div class="empty small">${ic('highlighter')}<div>No highlights yet.</div><div>Select any text to highlight it.</div></div>`); }
  else body = `<div class="demo" style="margin-bottom:12px">${ic('info')}<span><b>Demo mode.</b> Runs on your device, not a real AI. A real model needs an API connection.</span></div><div class="row" style="gap:6px;margin-bottom:10px">${[['summarize', 'Summarise'], ['explain', 'Explain simply'], ['notes', 'Revision notes'], ['questions', 'Questions']].map(([k, l]) => `<button class="btn sm soft" data-act="r-ai" data-k="${k}">${l}</button>`).join('')}</div><div class="row" style="gap:6px;margin-bottom:10px"><input type="text" id="r-ai-q" placeholder="Ask about this material…" style="flex:1;min-width:0" autocomplete="off"><button class="btn sm" data-act="r-ai" data-k="ask" aria-label="Ask">${ic('search')}</button></div><div class="aiout" id="r-ai-out" style="margin:0">${rd.aiOut || '<p class="muted small">Pick a tool. It works on the section you are reading, or on the text you selected.</p>'}</div>`;
  pn.innerHTML = `<button class="ib xbtn" data-act="r-panel-close" aria-label="Close panel">${ic('x')}</button><div class="tabs">${T.map(([k, l]) => `<button class="${rd.tab === k ? 'on' : ''}" data-act="r-tab" data-k="${k}">${l}</button>`).join('')}</div><div class="rpbody">${body}</div>`;
  const nb = pn.querySelector('.rpbody'); if (nb) nb.scrollTop = keep;
  const q = $('#r-ai-q'); if (q) q.addEventListener('keydown', e => { if (e.key === 'Enter') runReaderAI('ask'); });
}
function runReaderAI(kind, text) {
  const q = ($('#r-ai-q') || {}).value || ''; const si = curSec(); const ctx = { mode: 'section', docId: rd.id, sIdx: si }; let html = '';
  if (kind === 'summarize') html = AI.summarize(ctx, 'short');
  else if (kind === 'notes') html = AI.notes(ctx);
  else if (kind === 'ask') { if (!q.trim()) { toast('Type a question first.', 'info'); return; } html = AI.ask(q, { mode: 'doc', docId: rd.id }); }
  else if (kind === 'explain') { const t = text || rd.selText || (sectionsOf(rd.id)[si] ? sectionsOf(rd.id)[si].blocks.filter(b => b.t === 'p').slice(0, 2).map(b => b.text).join(' ') : ''); html = AI.explain(t, rd.id); }
  else if (kind === 'questions') { const qs = genQuestions(ctx, 5); lastGen = qs; html = qs.length ? `<ol>${qs.map(x => `<li style="margin-bottom:6px">${esc(x.q)}<div class="small muted">${x.type === 'mcq' ? x.opts.map((o, i) => String.fromCharCode(65 + i) + ') ' + esc(o)).join(' · ') : 'True or false?'}</div></li>`).join('')}</ol><button class="btn sm" data-act="quiz-gen">${ic('target')} Take this quiz</button>` : '<p>Not enough text in this section to make questions.</p>'; }
  rd.aiOut = html; rd.tab = 'ai'; if (!rd.panel) openPanel('ai'); else renderPanel();
}
function openAa(btn) {
  closeAa(); const m = document.createElement('div'); m.className = 'menu'; m.id = 'aamenu'; m.style.cssText = 'right:0;top:44px;width:250px;padding:14px'; const st = S.settings;
  m.innerHTML = `<label class="f" for="aa-fs">Text size <b id="aa-v">${st.fontSize}px</b></label><input type="range" id="aa-fs" min="14" max="30" value="${st.fontSize}" style="padding:0;margin-bottom:12px"><div class="seg" style="margin-bottom:12px"><button data-act="set-font" data-k="serif" class="${st.font === 'serif' ? 'on' : ''}" style="flex:1">Serif</button><button data-act="set-font" data-k="sans" class="${st.font === 'sans' ? 'on' : ''}" style="flex:1">Sans</button></div><div class="small muted">Dark mode: use the moon button.</div>`;
  btn.parentNode.appendChild(m); $('#aa-fs', m).addEventListener('input', e => { S.settings.fontSize = +e.target.value; $('#aa-v').textContent = e.target.value + 'px'; const t = $('#rtext'); if (t) t.style.setProperty('--rfs', e.target.value + 'px'); save(); });
}
function closeAa() { const m = $('#aamenu'); if (m) m.remove(); }
function updateThemeIcons() { const dark = document.documentElement.dataset.theme === 'dark'; $$('[data-act="toggle-theme"] svg').forEach(s => { s.innerHTML = dark ? IC.sun : IC.moon; }); const tl = $('#theme-lbl'); if (tl) tl.textContent = dark ? 'Light mode' : 'Dark mode'; }

/* ===================== global events & init ===================== */
function planMyDay() {
  const arr = S.planner[planDay] = S.planner[planDay] || []; let n = 0;
  planSuggestions().forEach(s => { if (!arr.some(t => t.text === s.text)) { arr.push({ id: uid('t'), text: s.text, time: s.time, doc: s.doc, done: false }); n++; } });
  save(); toast(n ? `Added ${plural(n, 'task')} to your plan` : 'Your plan already has these tasks', 'calendar'); render(true);
}
const copyText = t => { try { navigator.clipboard.writeText(t).then(() => toast('Copied'), () => toast('Could not copy', 'info')); } catch (e) { toast('Could not copy', 'info'); } };
function onAct(act, el, ev) {
  const D = el.dataset; const pdfMode = rd.mode === 'pdf' && rd.pdf;
  switch (act) {
    case 'close-modal': closeModal(); break;
    case 'toggle-theme': S.settings.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); updateThemeIcons(); break;
    case 'goto-planner': go('planner'); break;
    case 'upload': openUpload(); break;
    case 'open': openDoc(D.id); break;
    case 'fav': { const i = S.favs.indexOf(D.id); if (i < 0) { S.favs.push(D.id); toast('Added to favourites', 'heart'); } else { S.favs.splice(i, 1); toast('Removed from favourites', 'info'); } save(); render(true); break; }
    case 'doc-menu': { const card = el.closest('.dcard'); const had = $('.menu', card); $$('.menu').forEach(m => m.remove()); if (had) break; const m = document.createElement('div'); m.className = 'menu'; m.innerHTML = `<button data-act="edit-doc" data-id="${D.id}">${ic('edit')} Edit details</button><button class="danger" data-act="del-doc" data-id="${D.id}">${ic('trash')} Delete</button>`; card.appendChild(m); break; }
    case 'edit-doc': editDocModal(D.id); break;
    case 'del-doc': confirmBox('Delete this document?', `“${docById(D.id).title}” and its progress, bookmarks and highlights will be removed from this device.`, 'Delete', () => deleteDoc(D.id)); break;
    case 'lib-filter': lib.filter = D.k; lib.q = ''; render(true); break;
    case 'open-hit': openDoc(D.doc, { sec: +D.sec, blk: +D.blk }); break;
    case 'open-src': closeModal(); openDoc(D.doc, { sec: +D.sec }); break;
    case 'ai-go': runAI(D.k); break;
    case 'ai-copy': { const r = ai.results.find(x => x.id === D.i); if (r) copyText(stripHtml(r.html)); break; }
    case 'ai-del': ai.results = ai.results.filter(x => x.id !== D.i); $('#ai-results').innerHTML = ai.results.length ? ai.results.map(aiCard).join('') : ''; break;
    case 'quiz-gen': if (lastGen && lastGen.length) startQuiz(lastGen, 'Generated practice'); break;
    case 'quiz-doc': startQuiz(shuffle(poolFor(D.id)).slice(0, 10), docById(D.id).title); break;
    case 'quiz-start': quizFromSetup(); break;
    case 'quiz-again': startQuiz(shuffle(pr.run.qs), pr.run.title); break;
    case 'quiz-exit': pr.run = null; render(); break;
    case 'q-ans': answerQ(+D.i); break;
    case 'q-next': if (pr.run.i + 1 >= pr.run.qs.length) finishQuiz(); else { pr.run.i++; pr.run.picked = null; render(true); window.scrollTo(0, 0); } break;
    case 'rev-missed': openRevision('missed'); break;
    case 'rev-terms': openRevision('terms'); break;
    case 'rev-flip': pr.rev.flip = !pr.rev.flip; render(true); break;
    case 'rev-prev': pr.rev.i = Math.max(0, pr.rev.i - 1); pr.rev.flip = false; render(true); break;
    case 'rev-next': pr.rev.i = Math.min(pr.rev.cards.length - 1, pr.rev.i + 1); pr.rev.flip = false; render(true); break;
    case 'rev-shuffle': pr.rev.cards = shuffle(pr.rev.cards); pr.rev.i = 0; pr.rev.flip = false; render(true); break;
    case 'rev-got': { const c = pr.rev.cards[pr.rev.i]; if (c && c.id) delete S.quiz.missed[c.id]; pr.rev.cards.splice(pr.rev.i, 1); pr.rev.i = Math.min(pr.rev.i, pr.rev.cards.length - 1); pr.rev.flip = false; save(); toast('Removed from missed questions', 'check'); if (!pr.rev.cards.length) pr.rev.i = 0; render(true); break; }
    case 'rev-exit': pr.rev = null; render(); break;
    case 'hist-clear': S.quiz.history = []; save(); render(true); break;
    case 'tm-mode': setMode(D.k); break;
    case 'tm-toggle': S.timer.running ? pauseTimer() : startTimer(); break;
    case 'tm-reset': resetTimer(); break;
    case 'tm-skip': timerDone(true); break;
    case 'plan-day': planDay = dkey(); planMyDay(); break;
    case 'plan-select': planDay = D.k; render(true); break;
    case 'task-toggle': { const t = (S.planner[D.day] || []).find(x => x.id === D.id); if (t) { t.done = !t.done; save(); render(true); } break; }
    case 'task-del': S.planner[D.day] = (S.planner[D.day] || []).filter(x => x.id !== D.id); if (!S.planner[D.day].length) delete S.planner[D.day]; save(); render(true); break;
    case 'task-clear': S.planner[planDay] = (S.planner[planDay] || []).filter(x => !x.done); save(); render(true); break;
    case 'sv-tab': sv.tab = D.k; render(true); break;
    case 'open-bm': { const b = S.bookmarks.find(x => x.id === D.id); if (b) openDoc(b.doc, b.page ? { page: b.page, sec: b.sec } : { sec: b.sec }); break; }
    case 'bm-del': S.bookmarks = S.bookmarks.filter(x => x.id !== D.id); save(); if (route().name === 'read') { $$('[data-act="bm-sec"]').forEach(b => b.classList.toggle('on', S.bookmarks.some(x => x.doc === rd.id && x.page == null && x.sec === +b.dataset.s))); updateBm(); renderPanel(); } else render(true); break;
    case 'open-hl': { const h = (S.hl[D.doc] || []).find(x => x.id === D.id); if (h) openDoc(D.doc, { sec: h.s, blk: h.b }); break; }
    case 'hl-del': removeHighlight(D.doc, D.id); if (route().name === 'read') renderPanel(); else render(true); break;
    case 'set-theme': S.settings.theme = D.k; applyTheme(); save(); render(true); break;
    case 'set-font': S.settings.font = D.k; save(); { const t = $('#rtext'); if (t) { t.classList.remove('serif', 'sans'); t.classList.add(D.k); } $$('[data-act="set-font"]').forEach(b => b.classList.toggle('on', b.dataset.k === D.k)); } break;
    case 'export': exportData(); break;
    case 'import': $('#import-file').click(); break;
    case 'reset-all': confirmBox('Reset everything?', 'This deletes your uploads, progress, bookmarks, highlights, planner and settings from this device. It cannot be undone.', 'Delete everything', async () => { try { for (const r of await idbAll()) await idbDel(r.id); if (idb && idb.objectStoreNames.contains('tt')) idb.transaction('tt', 'readwrite').objectStore('tt').clear(); ['studyhub.tt.data', 'studyhub.tt.fired'].forEach(k => localStorage.removeItem(k)); } catch (e) { } localStorage.removeItem(KEY); localStorage.removeItem(TCFG_KEY); localStorage.removeItem(TFB_KEY); try { indexedDB.deleteDatabase('studyhub-tt'); } catch (e) { } location.hash = ''; location.reload(); }); break;
    /* reader */
    case 'r-back': r_back(); break;
    case 'r-bm': toggleBm(); break;
    case 'bm-sec': toggleBm(+D.s); break;
    case 'r-aa': $('#aamenu') ? closeAa() : openAa(el); break;
    case 'r-panel': rd.panel ? closePanel() : openPanel(D.k); break;
    case 'r-panel-close': closePanel(); break;
    case 'r-tab': rd.tab = D.k; renderPanel(); break;
    case 'r-sec': readerJump({ sec: +D.s }); if (window.innerWidth < 900) closePanel(); break;
    case 'r-mode': progOf(rd.id).mode = D.k; save(); render(); break;
    case 'r-complete': setComplete(!progOf(rd.id).completed); break;
    case 'r-ai': runReaderAI(D.k); break;
    case 'explain-term': rd.aiOut = AI.term(D.term, rd.id); rd.tab = 'ai'; openPanel('ai'); break;
    case 'sel-color': applyHighlight(D.c); break;
    case 'sel-remove': if (rd.hid) { removeHighlight(rd.id, rd.hid); hideSel(); toast('Highlight removed', 'info'); } break;
    case 'sel-copy': copyText(rd.selText); getSelection().removeAllRanges(); hideSel(); break;
    case 'sel-explain': { const t = rd.selText; hideSel(); getSelection().removeAllRanges(); rd.aiOut = AI.explain(t, rd.id); rd.tab = 'ai'; openPanel('ai'); break; }
    case 'pg-prev': if (pdfMode) showPage(rd.pdf.page - 1); break;
    case 'pg-next': if (pdfMode) showPage(rd.pdf.page + 1); break;
    case 'pg-zin': if (pdfMode) { rd.pdf.zoom = Math.min(3, rd.pdf.zoom + .25); showPage(rd.pdf.page); } break;
    case 'pg-zout': if (pdfMode) { rd.pdf.zoom = Math.max(.5, rd.pdf.zoom - .25); showPage(rd.pdf.page); } break;
    default: ttAct(act, D, el, ev);
  }
}
function wireEvents() {
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu') && !e.target.closest('[data-act="doc-menu"]')) $$('.dcard .menu').forEach(m => m.remove());
    const el = e.target.closest('[data-act]'); if (!el) return; if (el.tagName === 'A' && el.getAttribute('href')) return;
    e.preventDefault(); onAct(el.dataset.act, el, e);
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act][tabindex]') && !e.target.matches('input,textarea,select,button')) { e.preventDefault(); e.target.click(); } if (e.key === 'Escape') closeModal(); });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'tm-dur') { S.timer.dur[S.timer.mode] = +t.value; if (!S.timer.running) S.timer.left = +t.value * 60; else { S.timer.running = false; S.timer.left = +t.value * 60; } save(); timerUI(true); }
    if (t.dataset && t.dataset.goal) { S.goals[t.dataset.goal] = clamp(+t.value || 1, 1, 600); save(); render(true); toast('Goal updated', 'target'); }
  });
  window.addEventListener('hashchange', () => render());
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (S.settings.theme === 'auto') { applyTheme(); updateThemeIcons(); } });
  let dragN = 0; window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
  window.addEventListener('drop', e => { if (e.target.closest && e.target.closest('#dropz')) return; if (e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); if (route().name === 'read') return; openUpload(); handleFiles([...e.dataTransfer.files]); } });
}
async function init() {
  loadState(); ttInitPrefs(); applyTheme(); $('#app').innerHTML = shellHTML(); initLibrary(); rebuildLib(); wireEvents(); render(); updateThemeIcons();
  try { idb = await idbOpen(); } catch (e) { idb = null; }
  try { (await idbAll()).forEach(r => { if (S.docs.some(d => d.id === r.id)) CONTENT[r.id] = { sections: r.sections || [] }; }); } catch (e) { console.warn(e); }
  try { Object.assign(TT, ttSanitize(await TTRepo.load())); } catch (e) { console.warn(e); }
  S.docs.forEach(d => { if (!CONTENT[d.id]) CONTENT[d.id] = { sections: [] }; });
  rebuildLib(); render(true); S.tipIdx = Math.floor(Date.now() / 86400000) % TIPS.length;
  const t = S.timer; if (t.running) { if (t.endsAt <= Date.now()) timerDone(true); else lastTick = Date.now(); }
  initDrag(); setInterval(tick, 500); remindTick(); setInterval(remindTick, 15000);
  setInterval(() => { if (route().name === 'timetable' && !$('#modal') && !document.body.classList.contains('dragging') && document.visibilityState === 'visible') render(true); }, 60000);
  if (!S.onboarded) setTimeout(onboarding, 300);
  window.__studyhub = { ready: true, TT, S, generateTimetable, allConflicts, remindTick, buildPDF };
}
init().catch(e => { console.error(e); const a = document.getElementById('app'); if (a && !a.children.length) a.innerHTML = '<div style="padding:28px;font-family:sans-serif"><h2>StudyHub could not start</h2><p>' + String(e && e.message || e) + '</p><p>Try another browser, or clear this site\'s data and reload.</p></div>'; });
})();
